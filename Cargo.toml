[package]
name = "flytosnap"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "A native macOS screenshot tool inspired by Feishu"
license = "MIT"

[dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "block2", "dispatch2"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-vision = "0.3"
dispatch2 = "0.3"
block2 = "0.6"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
